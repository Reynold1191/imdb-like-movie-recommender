services:

  # ─── Flask Web App ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: movie-web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-cinescope-secret-2024}
    ports:
      - "5000:5000"
    networks:
      - movie_net
    depends_on:
      db:
        condition: service_healthy

  # ─── PostgreSQL (Dockerised) ───────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: movie-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed as 5433 on the host so it doesn't clash with your local Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # runs *.sql on first boot
    networks:
      - movie_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin 4 (web GUI) ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: movie-pgadmin
    restart: unless-stopped
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"          # desktop-style: no login wall
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro   # pre-load servers
      - ./db/pgadmin/pgpass:/pgpass:ro                         # saved passwords
    networks:
      - movie_net
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Lets pgAdmin reach your LOCAL Postgres (localhost:5432) from inside Docker
      - "host.docker.internal:host-gateway"

  # ─── One-shot CSV Loader (opt-in — does not run on plain `compose up`) ─────
  load_csv:
    image: python:3.12-slim
    container_name: movie-load-csv
    profiles:
      - loader        # docker compose --profile loader up load_csv
    working_dir: /app
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app
    networks:
      - movie_net
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install psycopg2-binary python-dotenv &&
             python scripts/load_csv_to_postgres.py"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  movie_net:
    driver: bridge
